[package]
name = "strands-shell-demo"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
strands-shell = { git = "https://github.com/strands-agents/shell", rev = "d4c57a7a6a6c86080024c8dbad49357c2d412a02" }
tokio = { version = "1", features = ["rt"] }
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
